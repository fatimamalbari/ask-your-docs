[project]
name = "docask-ingest"
version = "0.1.0"
description = "Parses, chunks and embeds documents into index shards for DocAsk"
requires-python = ">=3.11"
dependencies = [
  "pymupdf>=1.24",
  "google-genai>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docask_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
